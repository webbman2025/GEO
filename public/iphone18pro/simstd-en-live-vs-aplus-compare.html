<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>simstd-en — Live vs GEO A+ (compare)</title>
  <style>
    :root {
      --bar: #1a1033;
      --accent: #774fda;
      --divider: #774fda;
      --label-bg: rgba(26, 16, 51, 0.88);
    }
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
    }
    body {
      display: flex;
      flex-direction: column;
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f0a1a;
      color: #fff;
    }
    .top {
      flex: 0 0 auto;
      display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 1rem;
      padding: 0.55rem 0.85rem; background: var(--bar); border-bottom: 1px solid #3d2d66;
      font-size: 0.82rem;
    }
    .top h1 { margin: 0; font-size: 0.95rem; font-weight: 700; flex: 1 1 12rem; }
    .top a { color: #c4b5fd; }
    .top .hint { opacity: 0.85; font-size: 0.75rem; flex: 1 1 100%; }
    @media (min-width: 900px) {
      .top .hint { flex: 1 1 auto; }
    }
    .compare {
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
      max-width: 100%;
      display: flex;
      align-items: stretch;
      overflow: hidden;
    }
    .pane {
      flex: 1 1 50%;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .pane-label {
      flex: 0 0 auto;
      padding: 0.35rem 0.65rem; font-size: 0.75rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.04em; background: var(--label-bg); border-bottom: 2px solid var(--accent);
    }
    .pane--live .pane-label { border-color: #888; }
    .pane iframe {
      flex: 1 1 auto;
      width: 100%;
      min-height: 0;
      height: 100%;
      border: 0;
      background: #fff;
      display: block;
    }
    .divider {
      flex: 0 0 10px;
      background: var(--divider);
      cursor: col-resize;
      touch-action: none;
      z-index: 2;
      box-shadow: -2px 0 0 #0f0a1a, 2px 0 0 #0f0a1a;
    }
    .divider::after {
      content: "";
      position: absolute;
      left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      width: 4px; height: min(120px, 30vh);
      background: rgba(255,255,255,0.55);
      border-radius: 2px;
    }
    .divider { position: relative; }
    @media (max-width: 960px) {
      .compare { flex-direction: column; }
      .pane { flex: 1 1 50%; }
      .divider {
        flex: 0 0 10px;
        width: 100%;
        height: 10px;
        cursor: row-resize;
      }
      .divider::after { width: 48px; height: 4px; }
    }
  </style>
</head>
<body>
  <header class="top">
    <h1>iPhone 18 simstd-en — Live snapshot vs GEO A+ template</h1>
    <a href="https://iphone.three.com.hk/website/iphone18pro/simstd-en.html" target="_blank" rel="noopener">Production URL</a>
    <span class="hint">Scroll inside each pane · drag purple bar to resize · use ‹ › on tables when narrow</span>
  </header>
  <div class="compare" id="compare">
    <div class="pane pane--live" id="pane-left">
      <div class="pane-label">Live (snapshot)</div>
      <iframe title="Live snapshot" src="simstd-en-live-snapshot.html?compare=1" referrerpolicy="no-referrer-when-downgrade"></iframe>
    </div>
    <div class="divider" id="divider" role="separator" aria-orientation="vertical" aria-label="Resize panes"></div>
    <div class="pane pane--aplus" id="pane-right">
      <div class="pane-label">GEO / BLUF A+ template</div>
      <iframe title="A+ template" src="simstd-en-geo-aplus.html?compare=1"></iframe>
    </div>
  </div>
  <script>
(function () {
  var compare = document.getElementById("compare");
  var divider = document.getElementById("divider");
  var left = document.getElementById("pane-left");
  var right = document.getElementById("pane-right");
  var dragging = false;

  function isStacked() {
    return window.matchMedia("(max-width: 960px)").matches;
  }

  divider.addEventListener("pointerdown", function (e) {
    dragging = true;
    divider.setPointerCapture(e.pointerId);
    e.preventDefault();
  });

  divider.addEventListener("pointermove", function (e) {
    if (!dragging) return;
    var rect = compare.getBoundingClientRect();
    if (isStacked()) {
      var pct = ((e.clientY - rect.top) / rect.height) * 100;
      pct = Math.min(85, Math.max(15, pct));
      left.style.flex = "0 0 " + pct + "%";
      right.style.flex = "1 1 auto";
    } else {
      var pctX = ((e.clientX - rect.left) / rect.width) * 100;
      pctX = Math.min(85, Math.max(15, pctX));
      left.style.flex = "0 0 " + pctX + "%";
      right.style.flex = "1 1 auto";
    }
  });

  function stopDrag(e) {
    if (!dragging) return;
    dragging = false;
    try { divider.releasePointerCapture(e.pointerId); } catch (_) {}
  }
  divider.addEventListener("pointerup", stopDrag);
  divider.addEventListener("pointercancel", stopDrag);

  window.addEventListener("resize", function () {
    if (!dragging) {
      left.style.flex = right.style.flex = "";
    }
  });
})();
  </script>
</body>
</html>
